name: rebuild wiki

# The wiki builds a page per package from this repository. After a merge,
# ask it to rebuild so new and updated packages show up there.
#
# Needs a secret WIKI_TOKEN: a fine-grained token with "Contents: read and
# write" on binarylinuxx/dots-wiki. Without it this job is skipped, and the
# wiki still picks changes up in its daily build.

on:
  push:
    branches: [main]
    paths: [list.json, "plugins/**", "themes/**"]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the wiki to rebuild
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WIKI_TOKEN isn't set; the wiki will catch up in its daily build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/binarylinuxx/dots-wiki/dispatches \
            -d '{"event_type":"plugins-updated"}'
